version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - ineffassign
    - unused
    - misspell
    - bodyclose
    - noctx
    - errorlint

  settings:
    revive:
      rules:
        - name: exported
        - name: indent-error-flow
        - name: early-return
    errcheck:
      check-type-assertions: true

  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - noctx
          - bodyclose
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
